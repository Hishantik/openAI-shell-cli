[project]
name = "dekuai"
version = "0.3.0"
description = "Multi-provider AI CLI tool with GPT, Claude, Gemini, and open-source models"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Hishantik", email = ""}
]
dependencies = [
    "click>=8.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
dekuai = "dekuai.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dekuai*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.black]
line-length = 100